<!DOCTYPE html>
<html>
<head>
    <title>Green Page</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #43a047;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: system-ui, sans-serif;
        }
        h1 { font-size: 3rem; margin-bottom: 2rem; }
        .group { margin: 10px 0; }
        .label { font-size: 0.9rem; opacity: 0.8; margin-bottom: 5px; }
        nav { display: flex; gap: 10px; }
        a {
            color: white;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
        }
        a:hover { background: rgba(0,0,0,0.4); }
    </style>
</head>
<body onload="if (!window.name) window.name = 'green'">
    <h1>GREEN PAGE</h1>

    <div class="group">
        <div class="label">Own tab (named after color)</div>
        <nav>
            <a href="page-red.html" target="red">Red</a>
            <a href="page-green.html" target="green">Green</a>
            <a href="page-blue.html" target="blue">Blue</a>
        </nav>
    </div>

    <div class="group">
        <div class="label">Shared tab (all use "shared")</div>
        <nav>
            <a href="page-red.html" target="shared">Red</a>
            <a href="page-green.html" target="shared">Green</a>
            <a href="page-blue.html" target="shared">Blue</a>
        </nav>
    </div>
</body>
</html>
