<!DOCTYPE html>
<html>
<head>
    <title>Red Page</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #e53935;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: system-ui, sans-serif;
        }
        h1 { font-size: 3rem; margin-bottom: 2rem; }
        nav { display: flex; gap: 10px; }
        a {
            color: white;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
        }
        a:hover { background: rgba(0,0,0,0.4); }
    </style>
</head>
<body onload="if (!window.name) window.name = 'red'">
    <h1>RED PAGE</h1>
    <nav>
        <a href="page-red.html">Red</a>
        <a href="page-green.html">Green</a>
        <a href="page-blue.html">Blue</a>
    </nav>

    <script>
        const routes = {
            'page-red.html': 'red',
            'page-green.html': 'green',
            'page-blue.html': 'blue',
        };

        document.addEventListener('click', (e) => {
            const link = e.target.closest('a[href]');
            if (!link) return;

            const href = link.getAttribute('href');
            const target = routes[href];
            if (!target) return; // unmatched routes use default behavior

            e.preventDefault();
            window.open(link.href, target);
        });
    </script>
</body>
</html>
